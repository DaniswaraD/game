<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Space Shooter</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#0e230e;touch-action:none;-webkit-user-select:none;user-select:none;}
canvas{display:block;}
#hud{position:fixed;top:0;left:0;right:0;padding:12px 16px;font-family:Arial,Helvetica,sans-serif;color:#eafcea;pointer-events:none;}
#topRow{display:flex;justify-content:space-between;align-items:flex-start;max-width:620px;margin:0 auto;}
#hpWrap{display:flex;flex-direction:column;gap:4px;}
#hpLabel{font-size:10px;letter-spacing:2px;opacity:0.8;text-shadow:0 0 4px #0e230e;}
#hpBarBg{width:min(52vw,240px);height:16px;background:rgba(14,35,14,0.75);border:2px solid #eafcea;border-radius:8px;overflow:hidden;box-shadow:0 0 10px rgba(0,0,0,0.35);}
#hpBarFill{height:100%;width:100%;background:linear-gradient(90deg,#2f9e2f,#59e05f);transition:width .12s linear;}
#hpBarFill.low{background:linear-gradient(90deg,#c93f3f,#ff7a5f);animation:pulseLow .55s infinite;}
@keyframes pulseLow{0%{opacity:1;}50%{opacity:0.55;}100%{opacity:1;}}
#rightInfo{text-align:right;}
#timerText{font-size:22px;font-weight:bold;text-shadow:0 0 6px #0e230e;}
#lvlText{font-size:12px;text-shadow:0 0 4px #0e230e;margin-top:4px;opacity:0.9;}
#overlay{position:fixed;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(9,26,9,0.9);color:#eafcea;font-family:Arial,Helvetica,sans-serif;text-align:center;z-index:10;}
#overlay h1{font-size:40px;margin:0 0 12px 0;letter-spacing:2px;text-shadow:0 0 18px #3fbf3f;}
#overlay p{font-size:15px;margin:0 0 26px 0;max-width:280px;line-height:1.5;opacity:0.85;}
#restartBtn{padding:14px 34px;font-size:16px;font-weight:bold;background:linear-gradient(180deg,#59e05f,#2f9e2f);color:#0e230e;border:none;border-radius:12px;cursor:pointer;box-shadow:0 6px 0 #1f6b23,0 8px 18px rgba(0,0,0,0.35);}
#hint{position:fixed;bottom:16px;left:0;right:0;text-align:center;font-family:Arial,Helvetica,sans-serif;color:#eafcea;font-size:12px;opacity:0.7;pointer-events:none;text-shadow:0 0 4px #0e230e;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
<div id="topRow">
<div id="hpWrap">
<div id="hpLabel">HULL</div>
<div id="hpBarBg"><div id="hpBarFill"></div></div>
</div>
<div id="rightInfo">
<div id="timerText">60</div>
<div id="lvlText">Level tembakan x1</div>
</div>
</div>
</div>
<div id="hint">Geser jari kiri atau kanan untuk bergerak</div>
<div id="overlay">
<h1 id="overlayTitle"></h1>
<p id="overlayText"></p>
<button id="restartBtn">Main Lagi</button>
</div>
<script>
var canvas=document.getElementById('game');
var ctx=canvas.getContext('2d');
var vignetteCanvas=document.createElement('canvas');
var vctx=vignetteCanvas.getContext('2d');
var hpFill=document.getElementById('hpBarFill');
var timerText=document.getElementById('timerText');
var lvlText=document.getElementById('lvlText');
var overlay=document.getElementById('overlay');
var overlayTitle=document.getElementById('overlayTitle');
var overlayText=document.getElementById('overlayText');
var restartBtn=document.getElementById('restartBtn');

var W=0,H=0;
function resize(){
W=canvas.width=window.innerWidth;
H=canvas.height=window.innerHeight;
buildStars();
buildVignette();
}
window.addEventListener('resize',resize);

var BORDER=22;
var BASE_SIZE=46;
var MAX_HP=100;
var GAME_DURATION=60;
var BASE_ENEMY_SPEED=80;
var HEAL_BUBBLE_SPEED=BASE_ENEMY_SPEED*1.5;
var HEAL_RECOVER_RATIO=0.2;
var PLAYER_PROJ_SPEED=560;
var PLAYER_BASE_DAMAGE=10;
var PLAYER_FIRE_INTERVAL=1;
var CONTACT_DAMAGE_FACTOR=0.6;
var MAX_PARTICLES=110;
var MAX_ENEMY_PROJECTILES=220;

var COLOR_BG_EDGE='#173d17';
var COLOR_BG_TOP='#d6f2d2';
var COLOR_BG_BOTTOM='#a9dba3';
var COLOR_PLAYER='#2f7a3a';
var COLOR_PLAYER_LIGHT='#4fae5c';

var ENEMY_TYPES={
blueSmall:{size:0.8,hp:5,damage:3,shootType:'bullet',fireRate:1,color:'#a9c9f5',dark:'#5f8bd6',projSpeed:230,speed:85},
blueNormal:{size:1.0,hp:10,damage:5,shootType:'bullet',fireRate:1,color:'#5f93e0',dark:'#2f5fa8',projSpeed:230,speed:75},
blackSmall:{size:0.6,hp:15,damage:15,shootType:'laser',fireRate:1/3,color:'#3a3a3a',dark:'#141414',speed:70},
redSmall:{size:0.8,hp:20,damage:15,shootType:'projectile',fireRate:2,color:'#8f2a2a',dark:'#4f1212',projSpeed:260,speed:90},
blueBig:{size:1.8,hp:70,damage:35,shootType:'projectile',fireRate:3,color:'#243a7a',dark:'#0e1838',projSpeed:270,speed:42},
purpleZig:{size:0.9,hp:28,damage:12,shootType:'projectile',fireRate:1.5,color:'#8f5cbf',dark:'#4f2a70',projSpeed:240,speed:95,spin:true},
orangeTank:{size:1.4,hp:90,damage:18,shootType:'projectile',fireRate:1,color:'#d68a3c',dark:'#8a4f14',projSpeed:210,speed:38,spread:3,spreadAngle:0.35,pulse:true},
yellowFast:{size:0.7,hp:12,damage:8,shootType:'bullet',fireRate:2,color:'#e0d24a',dark:'#8f7f14',projSpeed:300,speed:150,streak:true},
crimsonLaser:{size:1.15,hp:45,damage:25,shootType:'laser',fireRate:1/2.5,color:'#a3244f',dark:'#5c0e28',speed:55}
};

var PHASES=[
{end:10,pool:['blueSmall','blueNormal'],interval:1.5,maxActive:4},
{end:20,pool:['blueSmall','blueNormal','blackSmall','redSmall'],interval:1.25,maxActive:5},
{end:30,pool:['blueNormal','redSmall','blackSmall','blueBig','purpleZig'],interval:1.1,maxActive:6},
{end:40,pool:['redSmall','purpleZig','blueBig','orangeTank','yellowFast'],interval:1.0,maxActive:7},
{end:50,pool:['purpleZig','orangeTank','yellowFast','crimsonLaser','blueBig'],interval:0.9,maxActive:8},
{end:60,pool:['blueSmall','blueNormal','blackSmall','redSmall','blueBig','purpleZig','orangeTank','yellowFast','crimsonLaser'],interval:0.6,maxActive:11}
];

var player,enemies,enemyProjectiles,playerProjectiles,healBubbles,lasers,particles,starsFar,starsNear;
var elapsed,running,spawnTimer,spawnMultiplier,activeCapDelta,lastThrottleCheck,upgradesDone,volleyCount,projDamage,fireTimer,healSpawnTimer,dragging,lastTouchX;
var shakeTime,shakeMag,flashTime,thrusterTimer,prevHp;

function buildStars(){
starsFar=[];
starsNear=[];
var pa=playArea();
var innerW=Math.max(1,pa.right-pa.left);
var innerH=Math.max(1,pa.bottom-pa.top);
var farCount=Math.min(90,Math.floor((innerW*innerH)/16000));
var nearCount=Math.min(50,Math.floor((innerW*innerH)/26000));
for(var i=0;i<farCount;i++){
starsFar.push({x:pa.left+Math.random()*innerW,y:pa.top+Math.random()*innerH,r:0.6+Math.random()*1.0,speed:14+Math.random()*10});
}
for(var j=0;j<nearCount;j++){
starsNear.push({x:pa.left+Math.random()*innerW,y:pa.top+Math.random()*innerH,r:1.2+Math.random()*1.4,speed:32+Math.random()*22});
}
}

function buildVignette(){
vignetteCanvas.width=W;
vignetteCanvas.height=H;
var g=vctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.72);
g.addColorStop(0,'rgba(23,61,23,0)');
g.addColorStop(1,'rgba(11,31,11,0.35)');
vctx.fillStyle=g;
vctx.fillRect(0,0,W,H);
}

function resetGame(){
player={x:W/2-BASE_SIZE/2,y:H-BORDER-160,width:BASE_SIZE,height:BASE_SIZE,hp:MAX_HP};
enemies=[];
enemyProjectiles=[];
playerProjectiles=[];
healBubbles=[];
lasers=[];
particles=[];
elapsed=0;
running=true;
spawnTimer=1.2;
spawnMultiplier=1;
activeCapDelta=0;
lastThrottleCheck=0;
upgradesDone=0;
volleyCount=1;
projDamage=PLAYER_BASE_DAMAGE;
fireTimer=PLAYER_FIRE_INTERVAL;
healSpawnTimer=8+Math.random()*5;
dragging=false;
lastTouchX=0;
shakeTime=0;
shakeMag=0;
flashTime=0;
thrusterTimer=0;
prevHp=MAX_HP;
overlay.style.display='none';
updateHud();
}

function playArea(){
return{left:BORDER,right:W-BORDER,top:BORDER,bottom:H-BORDER};
}

function clampPlayer(){
var pa=playArea();
if(player.x<pa.left)player.x=pa.left;
if(player.x+player.width>pa.right)player.x=pa.right-player.width;
}

function roundRectPath(x,y,w,h,r){
ctx.beginPath();
ctx.moveTo(x+r,y);
ctx.arcTo(x+w,y,x+w,y+h,r);
ctx.arcTo(x+w,y+h,x,y+h,r);
ctx.arcTo(x,y+h,x,y,r);
ctx.arcTo(x,y,x+w,y,r);
ctx.closePath();
}

function getPhase(t){
for(var i=0;i<PHASES.length;i++){
if(t<PHASES[i].end)return PHASES[i];
}
return PHASES[PHASES.length-1];
}

function spawnEnemy(){
var phase=getPhase(elapsed);
var key=phase.pool[Math.floor(Math.random()*phase.pool.length)];
var def=ENEMY_TYPES[key];
var w=BASE_SIZE*def.size;
var pa=playArea();
var x=pa.left+Math.random()*(pa.right-pa.left-w);
var e={
type:key,x:x,y:pa.top-w-10,width:w,height:w,hp:def.hp,maxHp:def.hp,
damage:def.damage,shootType:def.shootType,fireRate:def.fireRate,
fireTimer:1/def.fireRate*(0.4+Math.random()*0.6),color:def.color,dark:def.dark,
speed:def.speed,projSpeed:def.projSpeed||0,
spread:def.spread||0,spreadAngle:def.spreadAngle||0,
spin:def.spin||false,pulse:def.pulse||false,streak:def.streak||false,
rotation:0,pulsePhase:Math.random()*Math.PI*2,streakTimer:0.08,alive:true
};
enemies.push(e);
}

function estimateEnemyDps(){
var total=0;
for(var i=0;i<enemies.length;i++){
total+=enemies[i].damage*enemies[i].fireRate;
}
return total;
}

function estimatePlayerDps(){
return volleyCount*projDamage;
}

function throttleCheck(){
if(elapsed>=40){
spawnMultiplier=Math.min(2.6,spawnMultiplier+0.35);
activeCapDelta+=1;
return;
}
var eDps=estimateEnemyDps();
var pDps=Math.max(1,estimatePlayerDps());
var ratio=eDps/pDps;
if(ratio>2.5){
spawnMultiplier=Math.max(0.55,spawnMultiplier-0.15);
activeCapDelta=Math.max(-2,activeCapDelta-1);
}else if(ratio<1){
spawnMultiplier=Math.min(1.3,spawnMultiplier+0.1);
}
}

function spawnManager(dt){
spawnTimer-=dt;
var phase=getPhase(elapsed);
var effInterval=phase.interval/spawnMultiplier;
var effMax=Math.max(3,phase.maxActive+activeCapDelta);
if(spawnTimer<=0&&enemies.length<effMax){
spawnEnemy();
if(elapsed>=40&&Math.random()<0.35&&enemies.length<effMax){
spawnEnemy();
}
spawnTimer=effInterval*(0.8+Math.random()*0.4);
}
var boundary=Math.floor(elapsed/10)*10;
if(boundary>lastThrottleCheck&&boundary>0&&boundary<=50){
lastThrottleCheck=boundary;
throttleCheck();
}
}

function upgradeManager(){
var targetUpgrades=Math.min(5,Math.floor(elapsed/10));
while(upgradesDone<targetUpgrades){
upgradesDone++;
volleyCount*=2;
projDamage=PLAYER_BASE_DAMAGE*Math.pow(1.1,upgradesDone);
}
}

function pushParticle(p){
if(particles.length>=MAX_PARTICLES){
particles.shift();
}
particles.push(p);
}

function pushEnemyProjectile(p){
if(enemyProjectiles.length>=MAX_ENEMY_PROJECTILES){
enemyProjectiles.shift();
}
enemyProjectiles.push(p);
}

function firePlayer(dt){
fireTimer-=dt;
if(fireTimer<=0){
fireTimer=PLAYER_FIRE_INTERVAL;
var cx=player.x+player.width/2;
var cy=player.y;
var count=volleyCount;
var spreadTotal=Math.min(0.9,0.08*(count-1));
for(var i=0;i<count;i++){
var t=count===1?0:(i/(count-1))-0.5;
var ang=-Math.PI/2+t*spreadTotal;
playerProjectiles.push({
x:cx,y:cy,
vx:Math.cos(ang)*PLAYER_PROJ_SPEED,
vy:Math.sin(ang)*PLAYER_PROJ_SPEED,
r:5,damage:projDamage
});
}
spawnMuzzleFlash();
}
}

function spawnMuzzleFlash(){
for(var i=0;i<4;i++){
pushParticle({
x:player.x+player.width/2+(Math.random()-0.5)*player.width*0.5,
y:player.y+4,
vx:(Math.random()-0.5)*40,
vy:-60-Math.random()*40,
life:0.22,maxLife:0.22,color:'#eaff8f',r:2+Math.random()*2
});
}
}

function fireEnemy(e){
var cx=e.x+e.width/2;
var cy=e.y+e.height/2;
if(e.shootType==='laser'){
var w=Math.min(46,6+e.damage*0.5);
lasers.push({x:cx,startY:e.y+e.height,width:w,damage:e.damage,timer:0.45,state:'warning',hasHit:false,dashOffset:0,sourceEnemy:e});
}else{
var count=e.spread>0?e.spread:1;
var r=Math.min(24,4+e.damage*0.3);
var spacing=e.width*0.32;
for(var i=0;i<count;i++){
var offX=count>1?(i-(count-1)/2)*spacing:0;
pushEnemyProjectile({
x:cx+offX,y:cy,
vx:0,vy:e.projSpeed,
r:r,damage:e.damage
});
}
}
}

function spawnParticles(x,y,color){
for(var i=0;i<8;i++){
var ang=Math.random()*Math.PI*2;
var spd=60+Math.random()*100;
pushParticle({
x:x,y:y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
life:0.3+Math.random()*0.2,maxLife:0.5,color:color,r:2.5+Math.random()*3
});
}
}

function triggerShake(mag,time){
shakeMag=Math.max(shakeMag,mag);
shakeTime=Math.max(shakeTime,time);
}

function updateEnemies(dt){
for(var i=enemies.length-1;i>=0;i--){
var e=enemies[i];
e.y+=e.speed*dt;
if(e.spin){
e.rotation+=dt*2.4;
}
if(e.pulse){
e.pulsePhase+=dt*3;
}
if(e.streak){
e.streakTimer-=dt;
if(e.streakTimer<=0){
e.streakTimer=0.05;
pushParticle({
x:e.x+e.width/2+(Math.random()-0.5)*6,y:e.y-4,
vx:0,vy:-40,life:0.16,maxLife:0.16,color:e.color,r:1.5+Math.random()
});
}
}
e.fireTimer-=dt;
if(e.fireTimer<=0){
fireEnemy(e);
e.fireTimer=1/e.fireRate;
}
if(e.y>H+60){
e.alive=false;
enemies.splice(i,1);
continue;
}
if(rectsOverlap(player,e)){
player.hp-=e.damage*CONTACT_DAMAGE_FACTOR;
spawnParticles(e.x+e.width/2,e.y+e.height/2,e.color);
triggerShake(10,0.25);
e.alive=false;
enemies.splice(i,1);
continue;
}
if(e.hp<=0){
spawnParticles(e.x+e.width/2,e.y+e.height/2,e.color);
e.alive=false;
enemies.splice(i,1);
}
}
}

function rectsOverlap(a,b){
return a.x<b.x+b.width&&a.x+a.width>b.x&&a.y<b.y+b.height&&a.y+a.height>b.y;
}

function circleRectOverlap(cx,cy,r,rect){
var closestX=Math.max(rect.x,Math.min(cx,rect.x+rect.width));
var closestY=Math.max(rect.y,Math.min(cy,rect.y+rect.height));
var dx=cx-closestX;
var dy=cy-closestY;
return dx*dx+dy*dy<r*r;
}

function updatePlayerProjectiles(dt){
for(var i=playerProjectiles.length-1;i>=0;i--){
var p=playerProjectiles[i];
p.px=p.x;
p.py=p.y;
p.x+=p.vx*dt;
p.y+=p.vy*dt;
if(p.y<-30||p.x<-30||p.x>W+30){
playerProjectiles.splice(i,1);
continue;
}
var hit=false;
for(var j=enemies.length-1;j>=0;j--){
var e=enemies[j];
if(circleRectOverlap(p.x,p.y,p.r,e)){
e.hp-=p.damage;
hit=true;
break;
}
}
if(hit){
playerProjectiles.splice(i,1);
}
}
}

function updateEnemyProjectiles(dt){
for(var i=enemyProjectiles.length-1;i>=0;i--){
var p=enemyProjectiles[i];
p.px=p.x;
p.py=p.y;
p.x+=p.vx*dt;
p.y+=p.vy*dt;
if(p.y>H+40||p.y<-40||p.x<-40||p.x>W+40){
enemyProjectiles.splice(i,1);
continue;
}
if(circleRectOverlap(p.x,p.y,p.r,player)){
player.hp-=p.damage;
enemyProjectiles.splice(i,1);
triggerShake(6,0.18);
}
}
}

function updateLasers(dt){
for(var i=lasers.length-1;i>=0;i--){
var l=lasers[i];
if(l.sourceEnemy&&l.sourceEnemy.alive){
l.x=l.sourceEnemy.x+l.sourceEnemy.width/2;
l.startY=l.sourceEnemy.y+l.sourceEnemy.height;
}
l.dashOffset-=dt*80;
l.timer-=dt;
if(l.state==='warning'&&l.timer<=0){
l.state='active';
l.timer=0.18;
}else if(l.state==='active'){
if(!l.hasHit){
var half=l.width/2;
var pcx=player.x+player.width/2;
if(pcx>l.x-half-player.width/2&&pcx<l.x+half+player.width/2&&player.y+player.height>l.startY){
player.hp-=l.damage;
l.hasHit=true;
triggerShake(12,0.3);
}
}
if(l.timer<=0){
l.sourceEnemy=null;
lasers.splice(i,1);
}
}
}
}

function updateHealBubbles(dt){
var pa=playArea();
healSpawnTimer-=dt;
if(healSpawnTimer<=0){
var x=pa.left+Math.random()*(pa.right-pa.left-24);
healBubbles.push({x:x,y:pa.top-30,r:16,phase:Math.random()*Math.PI*2});
healSpawnTimer=8+Math.random()*5;
}
for(var i=healBubbles.length-1;i>=0;i--){
var b=healBubbles[i];
b.y+=HEAL_BUBBLE_SPEED*dt;
b.phase+=dt*4;
if(b.y>H+30){
healBubbles.splice(i,1);
continue;
}
if(circleRectOverlap(b.x,b.y,b.r,player)){
player.hp=Math.min(MAX_HP,player.hp+MAX_HP*HEAL_RECOVER_RATIO);
spawnParticles(b.x,b.y,'#4be04b');
healBubbles.splice(i,1);
}
}
}

function updateParticles(dt){
for(var i=particles.length-1;i>=0;i--){
var p=particles[i];
p.life-=dt;
p.x+=p.vx*dt;
p.y+=p.vy*dt;
if(p.life<=0){
particles.splice(i,1);
}
}
}

function updateThruster(dt){
thrusterTimer-=dt;
if(thrusterTimer<=0){
thrusterTimer=0.045;
pushParticle({
x:player.x+player.width/2+(Math.random()-0.5)*(player.width*0.5),
y:player.y+player.height-2,
vx:(Math.random()-0.5)*20,
vy:90+Math.random()*60,
life:0.26,maxLife:0.26,
color:Math.random()<0.5?'#9dfca0':'#eaff8f',
r:2+Math.random()*2
});
}
}

function updateStars(dt){
var pa=playArea();
for(var i=0;i<starsFar.length;i++){
var s=starsFar[i];
s.y+=s.speed*dt;
if(s.y>pa.bottom){s.y=pa.top;s.x=pa.left+Math.random()*(pa.right-pa.left);}
}
for(var j=0;j<starsNear.length;j++){
var n=starsNear[j];
n.y+=n.speed*dt;
if(n.y>pa.bottom){n.y=pa.top;n.x=pa.left+Math.random()*(pa.right-pa.left);}
}
}

function drawBackground(){
var grad=ctx.createLinearGradient(0,0,0,H);
grad.addColorStop(0,COLOR_BG_TOP);
grad.addColorStop(1,COLOR_BG_BOTTOM);
ctx.fillStyle=COLOR_BG_EDGE;
ctx.fillRect(0,0,W,H);
ctx.fillStyle=grad;
ctx.fillRect(BORDER,BORDER,W-BORDER*2,H-BORDER*2);
}

function drawStars(){
ctx.fillStyle='rgba(255,255,255,0.32)';
for(var i=0;i<starsFar.length;i++){
var s=starsFar[i];
ctx.beginPath();
ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
ctx.fill();
}
ctx.fillStyle='rgba(23,61,23,0.4)';
for(var j=0;j<starsNear.length;j++){
var n=starsNear[j];
ctx.beginPath();
ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
ctx.fill();
}
}

function drawVignette(){
ctx.drawImage(vignetteCanvas,0,0);
}

function drawFrame(){
var pa=playArea();
var t=elapsed*2;
var glowAlpha=0.35+Math.sin(t)*0.15;
ctx.strokeStyle='rgba(23,61,23,'+glowAlpha+')';
ctx.lineWidth=2;
ctx.strokeRect(pa.left+2,pa.top+2,pa.right-pa.left-4,pa.bottom-pa.top-4);
var len=26;
ctx.lineWidth=3;
ctx.strokeStyle='rgba(23,61,23,0.55)';
function corner(x,y,dx,dy){
ctx.beginPath();
ctx.moveTo(x,y+dy*len);
ctx.lineTo(x,y);
ctx.lineTo(x+dx*len,y);
ctx.stroke();
}
corner(pa.left,pa.top,1,1);
corner(pa.right,pa.top,-1,1);
corner(pa.left,pa.bottom,1,-1);
corner(pa.right,pa.bottom,-1,-1);
}

function drawPlayer(){
var cx=player.x+player.width/2;
var cy=player.y+player.height/2;
var glow=ctx.createRadialGradient(cx,cy,4,cx,cy,player.width*1.3);
glow.addColorStop(0,'rgba(79,174,92,0.45)');
glow.addColorStop(1,'rgba(79,174,92,0)');
ctx.fillStyle=glow;
ctx.beginPath();
ctx.arc(cx,cy,player.width*1.3,0,Math.PI*2);
ctx.fill();

ctx.fillStyle=COLOR_PLAYER;
roundRectPath(player.x,player.y,player.width,player.height,10);
ctx.fill();

ctx.fillStyle=COLOR_PLAYER_LIGHT;
roundRectPath(player.x+6,player.y+6,player.width-12,player.height*0.42,6);
ctx.fill();

ctx.fillStyle='rgba(234,252,234,0.9)';
ctx.beginPath();
ctx.arc(cx,player.y+player.height*0.4,4,0,Math.PI*2);
ctx.fill();
}

function drawEnemyShape(e){
var cx=e.x+e.width/2;
var cy=e.y+e.height/2;
ctx.save();
ctx.translate(cx,cy);
if(e.spin){
ctx.rotate(e.rotation);
}
var scale=1;
if(e.pulse){
scale=1+Math.sin(e.pulsePhase)*0.05;
}
ctx.scale(scale,scale);

ctx.globalAlpha=0.16;
ctx.fillStyle=e.color;
ctx.beginPath();
ctx.arc(0,0,e.width*0.85,0,Math.PI*2);
ctx.fill();
ctx.globalAlpha=1;

ctx.fillStyle=e.dark;
roundRectPath(-e.width/2-2,-e.height/2-2,e.width+4,e.height+4,9);
ctx.fill();

ctx.fillStyle=e.color;
roundRectPath(-e.width/2,-e.height/2,e.width,e.height,7);
ctx.fill();

ctx.fillStyle='rgba(255,255,255,0.18)';
roundRectPath(-e.width/2+3,-e.height/2+3,e.width-6,e.height*0.35,5);
ctx.fill();

ctx.fillStyle=e.dark;
ctx.beginPath();
ctx.arc(0,0,e.width*0.16,0,Math.PI*2);
ctx.fill();

ctx.fillStyle=e.dark;
ctx.fillRect(-e.width/2-4,-e.height*0.12,4,e.height*0.24);
ctx.fillRect(e.width/2,-e.height*0.12,4,e.height*0.24);

ctx.fillStyle=e.dark;
ctx.beginPath();
ctx.moveTo(-e.width*0.14,e.height/2-1);
ctx.lineTo(e.width*0.14,e.height/2-1);
ctx.lineTo(0,e.height/2+8);
ctx.closePath();
ctx.fill();

ctx.restore();
}

function drawEnemies(){
for(var i=0;i<enemies.length;i++){
var e=enemies[i];
drawEnemyShape(e);
if(e.hp<e.maxHp){
var barW=e.width;
var ratio=Math.max(0,e.hp/e.maxHp);
ctx.fillStyle='rgba(0,0,0,0.4)';
ctx.fillRect(e.x,e.y-8,barW,4);
ctx.fillStyle='#eafcea';
ctx.fillRect(e.x,e.y-8,barW*ratio,4);
}
}
}

function drawProjectiles(){
ctx.lineCap='round';
for(var i=0;i<playerProjectiles.length;i++){
var p=playerProjectiles[i];
ctx.strokeStyle='rgba(234,255,143,0.55)';
ctx.lineWidth=p.r*1.4;
ctx.beginPath();
ctx.moveTo(p.px!==undefined?p.px:p.x,p.py!==undefined?p.py:p.y);
ctx.lineTo(p.x,p.y);
ctx.stroke();
ctx.fillStyle='#eaff8f';
ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fill();
}
for(var j=0;j<enemyProjectiles.length;j++){
var q=enemyProjectiles[j];
ctx.strokeStyle='rgba(255,95,95,0.4)';
ctx.lineWidth=q.r*1.2;
ctx.beginPath();
ctx.moveTo(q.px!==undefined?q.px:q.x,q.py!==undefined?q.py:q.y);
ctx.lineTo(q.x,q.y);
ctx.stroke();
ctx.fillStyle='#ff5f5f';
ctx.beginPath();
ctx.arc(q.x,q.y,q.r,0,Math.PI*2);
ctx.fill();
}
}

function drawLasers(){
for(var i=0;i<lasers.length;i++){
var l=lasers[i];
var flarePulse=3+Math.sin(elapsed*10)*1.5;
if(l.state==='warning'){
ctx.save();
ctx.setLineDash([9,7]);
ctx.lineDashOffset=l.dashOffset;
ctx.strokeStyle='rgba(255,60,60,0.55)';
ctx.lineWidth=l.width*0.55;
ctx.beginPath();
ctx.moveTo(l.x,l.startY);
ctx.lineTo(l.x,H);
ctx.stroke();
ctx.restore();
ctx.fillStyle='rgba(255,120,120,0.9)';
ctx.beginPath();
ctx.arc(l.x,l.startY,l.width*0.35+flarePulse,0,Math.PI*2);
ctx.fill();
}else{
var g=ctx.createLinearGradient(l.x-l.width/2,0,l.x+l.width/2,0);
g.addColorStop(0,'rgba(255,90,90,0.1)');
g.addColorStop(0.5,'rgba(255,220,220,0.95)');
g.addColorStop(1,'rgba(255,90,90,0.1)');
ctx.fillStyle=g;
ctx.fillRect(l.x-l.width/2,l.startY,l.width,H-l.startY);
ctx.fillStyle='rgba(255,220,220,0.95)';
ctx.beginPath();
ctx.arc(l.x,l.startY,l.width*0.5+flarePulse,0,Math.PI*2);
ctx.fill();
}
}
}

function drawHealBubbles(){
for(var i=0;i<healBubbles.length;i++){
var b=healBubbles[i];
var pulse=1+Math.sin(b.phase)*0.12;
ctx.globalAlpha=0.35;
ctx.fillStyle='#4be04b';
ctx.beginPath();
ctx.arc(b.x,b.y,b.r*1.8*pulse,0,Math.PI*2);
ctx.fill();
ctx.globalAlpha=1;

ctx.fillStyle='#4be04b';
ctx.beginPath();
ctx.arc(b.x,b.y,b.r*pulse,0,Math.PI*2);
ctx.fill();
ctx.strokeStyle='#eafcea';
ctx.lineWidth=2;
ctx.stroke();

ctx.fillStyle='#eafcea';
ctx.fillRect(b.x-2,b.y-7,4,14);
ctx.fillRect(b.x-7,b.y-2,14,4);
}
}

function drawParticles(){
for(var i=0;i<particles.length;i++){
var p=particles[i];
var alpha=Math.max(0,p.life/p.maxLife);
ctx.globalAlpha=alpha;
ctx.fillStyle=p.color;
ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fill();
}
ctx.globalAlpha=1;
}

function drawFlash(){
if(flashTime>0){
var a=Math.min(0.35,flashTime*1.2);
ctx.fillStyle='rgba(200,40,40,'+a+')';
ctx.fillRect(0,0,W,H);
}
}

function updateHud(){
var ratio=Math.max(0,player.hp/MAX_HP);
hpFill.style.width=(ratio*100)+'%';
if(ratio<=0.25){
hpFill.classList.add('low');
}else{
hpFill.classList.remove('low');
}
timerText.textContent=Math.max(0,Math.ceil(GAME_DURATION-elapsed));
lvlText.textContent='Level tembakan x'+volleyCount;
}

function endGame(won){
running=false;
overlay.style.display='flex';
if(won){
overlayTitle.textContent='MENANG';
overlayText.textContent='Kamu berhasil bertahan selama 60 detik.';
}else{
overlayTitle.textContent='KALAH';
overlayText.textContent='HP kamu habis, coba lagi.';
}
}

function loop(ts){
requestAnimationFrame(loop);
if(!running)return;
var dt=(loop.lastTs?(ts-loop.lastTs)/1000:0.016);
loop.lastTs=ts;
if(dt>0.05)dt=0.05;

elapsed+=dt;
upgradeManager();
spawnManager(dt);
firePlayer(dt);
updateEnemies(dt);
updatePlayerProjectiles(dt);
updateEnemyProjectiles(dt);
updateLasers(dt);
updateHealBubbles(dt);
updateParticles(dt);
updateThruster(dt);
updateStars(dt);
clampPlayer();

if(player.hp<prevHp){
flashTime=0.18;
}
prevHp=player.hp;
if(shakeTime>0)shakeTime-=dt;
if(flashTime>0)flashTime-=dt;

if(player.hp<=0){
player.hp=0;
updateHud();
endGame(false);
return;
}
if(elapsed>=GAME_DURATION){
endGame(true);
return;
}

ctx.save();
if(shakeTime>0){
var m=shakeMag*(shakeTime/0.3);
ctx.translate((Math.random()-0.5)*m,(Math.random()-0.5)*m);
}
drawBackground();
drawStars();
drawVignette();
drawFrame();
drawHealBubbles();
drawLasers();
drawEnemies();
drawProjectiles();
drawPlayer();
drawParticles();
drawFlash();
ctx.restore();
updateHud();
}

canvas.addEventListener('touchstart',function(ev){
dragging=true;
lastTouchX=ev.touches[0].clientX;
},{passive:true});

canvas.addEventListener('touchmove',function(ev){
if(!dragging)return;
var x=ev.touches[0].clientX;
var dx=x-lastTouchX;
player.x+=dx;
lastTouchX=x;
clampPlayer();
},{passive:true});

canvas.addEventListener('touchend',function(){
dragging=false;
});

canvas.addEventListener('mousedown',function(ev){
dragging=true;
lastTouchX=ev.clientX;
});
window.addEventListener('mousemove',function(ev){
if(!dragging)return;
var dx=ev.clientX-lastTouchX;
player.x+=dx;
lastTouchX=ev.clientX;
clampPlayer();
});
window.addEventListener('mouseup',function(){
dragging=false;
});

restartBtn.addEventListener('click',function(){
resetGame();
});

resize();
resetGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
