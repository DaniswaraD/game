<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Danis.Shooter — Library Lab</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#dfe9f2;background:#071019}body{margin:0;padding:32px;max-width:900px;margin-inline:auto}h1{letter-spacing:.08em}section{border:1px solid #21384b;background:#0b1620;border-radius:14px;padding:18px;margin:14px 0}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}button{background:#15283a;color:#e8f3fb;border:1px solid #31516a;border-radius:9px;padding:9px 13px;cursor:pointer}code{color:#7de3ff}#pixiHost{min-height:180px;position:relative;border:1px dashed #31516a;border-radius:10px;overflow:hidden}#pixiHost canvas{position:absolute;inset:0;width:100%;height:100%}.ok{color:#6ee7b7}.bad{color:#ff8d8d}.muted{color:#8196a8}
</style>
<script src="library-loader.js"></script>
</head>
<body>
<h1>DANIS.SHOOTER / LIBRARY LAB</h1>
<p class="muted">Developer-only page. It tests optional libraries without changing gameplay state.</p>
<section><h2>Availability</h2><div id="status"></div></section>
<section><h2>GSAP</h2><div id="box" style="width:64px;height:64px;border-radius:12px;background:#67c7f0"></div><button id="gsapTest">Run animation test</button></section>
<section><h2>Howler</h2><button id="audioTest">Play SFX test</button><span id="audioStatus" class="muted"></span></section>
<section><h2>PixiJS</h2><div id="pixiHost"></div><button id="pixiTest">Run renderer test</button><span id="pixiStatus" class="muted"></span></section>
<script>
(async function(){
  const status=document.getElementById('status');
  function row(name,ok,version){return '<div><b>'+name+'</b>: <span class="'+(ok?'ok':'bad')+'">'+(ok?'AVAILABLE':'UNAVAILABLE')+'</span> <code>'+version+'</code></div>';}
  await Promise.all([window.DS_LIBS.loadGsap().catch(()=>{}),window.DS_LIBS.loadHowler().catch(()=>{})]);
  status.innerHTML=row('GSAP',!!window.gsap,window.DS_LIBS.versions.gsap)+row('Howler',!!window.Howl,window.DS_LIBS.versions.howler)+'<div><b>PixiJS</b>: <span class="muted">lazy</span> <code>'+window.DS_LIBS.versions.pixi+'</code></div>';
  document.getElementById('gsapTest').onclick=function(){if(!window.gsap)return;gsap.fromTo('#box',{x:0,rotation:0},{x:700,rotation:360,duration:1,ease:'power3.inOut',yoyo:true,repeat:1});};
  document.getElementById('audioTest').onclick=function(){if(!window.Howl){document.getElementById('audioStatus').textContent=' Howler unavailable';return;}var h=new Howl({src:['audio/danis-sfx.wav'],sprite:{click:[0,44]},volume:.8});h.play('click');document.getElementById('audioStatus').textContent=' played';};
  document.getElementById('pixiTest').onclick=async function(){var st=document.getElementById('pixiStatus');try{await window.DS_LIBS.loadPixi();var app=new PIXI.Application();await app.init({resizeTo:document.getElementById('pixiHost'),backgroundAlpha:0,antialias:false,preference:'webgl'});document.getElementById('pixiHost').replaceChildren(app.canvas);for(let i=0;i<40;i++){let g=new PIXI.Graphics().circle(0,0,2+i%4).fill(0x67c7f0);g.x=Math.random()*app.screen.width;g.y=Math.random()*app.screen.height;app.stage.addChild(g);app.ticker.add((t)=>{g.x+=.3*t.deltaTime;if(g.x>app.screen.width+10)g.x=-10;});}st.textContent=' renderer initialized';}catch(e){st.textContent=' unavailable: '+e.message;}};
})();
</script>
</body></html>
